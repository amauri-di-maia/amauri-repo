name: Brickovery - Rebuild DB

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron e sempre UTC.
    # Lisboa: UTC no inverno e UTC+1 no verao.
    - cron: "15 3 * * *"  # 03:15 UTC

permissions:
  contents: read

concurrency:
  group: brickovery-rebuild
  cancel-in-progress: false

jobs:
  make_colors:
    name: make_colors (color_map)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests requests-oauthlib; fi

      - name: Preflight inputs
        run: |
          set -e
          test -f inputs/bricklink/colors.xml
          test -f inputs/bricklink/codes.xml
          test -f inputs/rebrickable/colors.csv
          test -f inputs/rebrickable/elements.csv
          test -f inputs/colors_seed.csv
          mkdir -p data

      - name: Build color map (resolve conflicts via BL part_id -> known colors)
        env:
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN: ${{ secrets.BRICKLINK_TOKEN }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKOWL_API_KEY: ${{ secrets.BRICKOWL_API_KEY }}
        run: |
          python brickovery_make_colors.py \
            --bl-colors-xml inputs/bricklink/colors.xml \
            --bl-codes-xml inputs/bricklink/codes.xml \
            --rb-elements inputs/rebrickable/elements.csv \
            --rb-colors inputs/rebrickable/colors.csv \
            --seed inputs/colors_seed.csv \
            --out data/color_map.csv \
            --audit data/color_map_audit.csv \
            --issues data/color_map_issues.csv \
            --cache-json data/api_cache.json \
            --max-part-checks 60 \
            --debug-apis

      - name: Summarize issues (severity counts + top types)
        if: always()
        run: |
          python - <<'PY'
          import csv, collections, os
          p="data/color_map_issues.csv"
          if not os.path.exists(p):
              print("missing", p)
              raise SystemExit(0)
          sev=collections.Counter()
          typ=collections.Counter()
          with open(p, newline="", encoding="utf-8") as f:
              r=csv.DictReader(f)
              for row in r:
                  sev[row.get("severity","").strip()] += 1
                  typ[row.get("issue_type","").strip()] += 1
          print("Severity:", dict(sev))
          for k,v in typ.most_common(25):
              print(f"{k}: {v}")
          PY

      - name: Upload color artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brickovery-colors
          path: |
            data/color_map.csv
            data/color_map_audit.csv
            data/color_map_issues.csv
            data/api_cache.json
          if-no-files-found: warn

  build_db:
    name: build_db (SQLite + part map)
    runs-on: ubuntu-latest
    needs: [make_colors]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests requests-oauthlib; fi

      - name: Download color artifacts
        uses: actions/download-artifact@v4
        with:
          name: brickovery-colors
          path: data

      - name: Preflight inputs
        run: |
          set -e
          test -f data/color_map.csv
          test -f inputs/bricklink/codes.xml
          test -f inputs/rebrickable/elements.csv
          mkdir -p data

      - name: Build DB + CSV (keeps BL parts even if RB element_id missing)
        env:
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN: ${{ secrets.BRICKLINK_TOKEN }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKOWL_API_KEY: ${{ secrets.BRICKOWL_API_KEY }}
        run: |
          python brickovery.py \
            --bl-codes-xml inputs/bricklink/codes.xml \
            --rb-elements inputs/rebrickable/elements.csv \
            --color-map data/color_map.csv \
            --db data/brickovery.db \
            --out-csv data/part_color_map.csv \
            --issues data/part_color_issues.csv \
            --resolve-boid \
            --boid-cache-json data/brickowl_api_cache.json \
            --debug-apis

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brickovery-build
          path: |
            data/brickovery.db
            data/part_color_map.csv
            data/part_color_issues.csv
            data/brickowl_api_cache.json
          if-no-files-found: warn
