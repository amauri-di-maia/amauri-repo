name: Brickovery - Rebuild DB

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

concurrency:
  group: brickovery-rebuild
  cancel-in-progress: false

jobs:
  make_colors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build strict color_map.csv
        run: |
          mkdir -p data
          python brickovery_make_colors.py \
            --bl-colors-xml inputs/bricklink/colors.xml \
            --rb-colors inputs/rebrickable/colors.csv \
            --seed inputs/colors_seed.csv \
            --out data/color_map.csv \
            --issues data/color_map_issues.csv \
            --strict

      - name: Summarize issues (counts + head)
        if: always()
        run: |
          echo "==== HEAD (first 80 lines) ===="
          if [ -f data/color_map_issues.csv ]; then
            head -n 80 data/color_map_issues.csv
          else
            echo "data/color_map_issues.csv not found"
          fi
          echo
          echo "==== COUNTS by issue_type ===="
          python - <<'PY'
          import csv, collections, os
          p="data/color_map_issues.csv"
          if not os.path.exists(p):
              print("missing", p)
              raise SystemExit(0)
          c=collections.Counter()
          with open(p, newline="", encoding="utf-8") as f:
              r=csv.DictReader(f)
              for row in r:
                  c[row.get("issue_type","").strip()]+=1
          for k,v in c.most_common():
              print(f"{k}: {v}")
          PY

      - name: Upload color artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brickovery-color-map
          path: |
            data/color_map.csv
            data/color_map_issues.csv
            data/color_map_audit.csv
            inputs/color_map_audit.csv
          if-no-files-found: warn

  build_matrix:
    runs-on: ubuntu-latest
    needs: [make_colors]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download color artifacts
        uses: actions/download-artifact@v4
        with:
          name: brickovery-color-map
          path: data

      - name: Build DB + matrix (strict)
        run: |
          mkdir -p data
          python brickovery.py \
            --db data/brickovery.db \
            --outdir data \
            --bl-dir inputs/bricklink \
            --rb-dir inputs/rebrickable \
            --color-map data/color_map.csv \
            --strict

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brickovery-build
          path: |
            data/brickovery.db
            data/part_color_matrix.csv
            data/build_report.md
            data/matrix_issues.csv
          if-no-files-found: warn
